<div class="modal fade bd-example-modal-lg show" #passingInfoModel tabindex="-1" role="dialog"
    aria-labelledby="PassingInfoModelTitle" aria-hidden="true" data-backdrop="false">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header" style="padding: 0.5rem 1rem !important;">
                <h5 class="modal-title" id="PassingInfoModelTitle">Passing Information</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true" (click)="close()">×</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-12">
                        <div class="tab-content">
                            <div class="row">

                                <div class="col-md-4 position-relative form-group">
                                    <label  class="">Branch </label>
                                    <input tabindex="28" type="text" class="form-control" placeholder="Branch" readonly
                                    [(ngModel)]="branchName">
                                </div>
                                <div class="col-md-4 position-relative form-group">
                                    <label  class="">General Ledger </label>
                                    <input tabindex="28" type="text" class="form-control" readonly
                                        placeholder="General Ledger" [(ngModel)]="uiVoucherTransactionDetails.glName">
                                </div>
                                <div class="col-md-4 position-relative form-group">
                                    <label  class="">Account Number </label>
                                    <input tabindex="28" type="text" class="form-control" readonly
                                        placeholder="Account Number" [(ngModel)]="uiVoucherTransactionDetails.accountNumber">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <fieldset>
                            <legend>Transaction Details</legend>
                            <div class="row">
                                <div class="col-md-6 position-relative form-group">
                                    <label>Transaction Amount </label>
                                    <input tabindex="28" type="number" class="form-control" readonly
                                    [(ngModel)]="uiVoucherTransactionDetails.transaction_Amount">
                                </div>
                                <div class="col-md-6 position-relative form-group">
                                    <label>Transaction Description </label>
                                    <input tabindex="28" type="text" class="form-control" readonly
                                    [(ngModel)]="uiVoucherTransactionDetails.transaction_Narration">
                                </div>
                                <div class="col-md-6 position-relative form-group">
                                    <label>Next Balance </label>
                                    <input tabindex="28" type="number" class="form-control" readonly
                                    [(ngModel)]="uiBankAccount.nextBalance">
                                </div>
                                <div class="col-md-6 position-relative form-group">
                                    <label>Cheque No </label>
                                    <input tabindex="28" type="text" class="form-control" readonly
                                    [(ngModel)]="uiBankAccount.chequeNo">
                                </div>
                                <div class="col-md-6 position-relative form-group">
                                    <label>Cheque Date </label>
                                    <input tabindex="28" type="text" class="form-control" readonly
                                    [(ngModel)]="uiBankAccount.chequeDate">
                                </div>
                                <div class="col-md-12 position-relative form-group">
                                    <button class="btn btn-info" tabindex="2"
                                    style="margin-top: 10px;" (click)="close()"> Cancel</button>
                                </div>
                            </div>
                        </fieldset>
                    </div>

                    <div class="col-md-6">
                        <fieldset>
                            <legend>Account Details</legend>
                            <div class="row">
                                <div class="col-md-12">
                                    <label>Customer Name </label>
                                    <label style="float: right;">{{uiBankAccount.custName}}</label>
                                </div>
                                <div class="col-md-12">
                                    <label>Account Number </label>
                                    <label style="float: right;">{{uiBankAccount.accountNo}}</label>
                                </div>
                                <div class="col-md-12">
                                    <label>Account Type </label>
                                    <label style="float: right;">{{uiBankAccount.accountType}}</label>
                                </div>
                                <div class="col-md-12">
                                    <label>Mode of Operation </label>
                                    <label style="float: right;">{{uiBankAccount.modeOfOperation}}</label>
                                </div>
                                <div class="col-md-12">
                                    <label>Last Transaction Date </label>
                                    <label style="float: right;">{{uiBankAccount.lastTransactionDate}}</label>
                                </div>
                                <div class="col-md-12">
                                    <label>Last Interest Date</label>
                                    <label style="float: right;">{{uiBankAccount.lastInterestDate}}</label>
                                </div>
                                <div class="col-md-12">
                                    <label>Opening Date</label>
                                    <label style="float: right;">{{uiBankAccount.openDate}}</label>
                                </div>
                                <div class="col-md-12">
                                    <label>Interest Rate </label>
                                    <label style="float: right;">{{uiBankAccount.interestRate}}</label>
                                </div>
                                <div class="col-md-12">
                                    <label>Balance </label>
                                    <label style="float: right;">{{uiBankAccount.balance}}</label>
                                </div>
                                <div class="col-md-12">
                                    <label>Min Balance </label>
                                    <label style="float: right;">{{uiBankAccount.minBalance}}</label>
                                </div>
                            </div>

                        </fieldset>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
