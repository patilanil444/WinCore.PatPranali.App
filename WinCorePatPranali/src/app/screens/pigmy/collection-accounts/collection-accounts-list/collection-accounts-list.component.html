

 <!--Page Code Start here-->
 <div class="pageMasterSection">

    <!--Page Content Start here-->
    <div class="pageContentSection">
        
        <!--Page Header Start here-->
        <div class="page-section-header">
            
            <label class="headerTitleText">

		  				Linked Collection Accounts
            </label> 

        </div>
        <!--Page Header End here-->

        <!--Page action content Start here-->
        <div class="page-section-content">

            <!--Page filter Start here-->
            <div class="page-section-filtersection">
                <form [formGroup]="collectionAccountForm" #form="ngForm">
                    <div class="filterSectionAllCotrols2">
                        <div class="filterSectionContentCotrols4">
                            <div>
                                <label  class="form_label_forControl labelwithFilter">Pigmy Agent</label>
                            </div>
                            <div class="input-group">
                                   <ngx-select-dropdown [config]="configAgent" tabindex="2" [options]="uiPigmyAgents"
                                    style="width: 100%;" formControlName="pigmyAgent"
                                    [multiple]="false"></ngx-select-dropdown>
                            </div>
                            
                        </div>
                        
                        <div class="filterSectionContentCotrols4_1 actionBtnsInFilterSection" >

                            <button type="button" class="btn action-InfoBtn" tabindex="4" 
                                (click)="showAccounts()">Show Accounts</button>

                             <button type="button" class=" btn action-primatryBtn" tabindex="4" 
                            (click)="linkNewAccount()">Link New Account</button>

                            

                        </div>
                    </div>              
                </form> 
            </div>


             <!--Page table content Start here-->
             <div class="page-section-tablecontent">

                <div>
                    <table class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th width="20%">Customer Name</th>
                                        <th width="20%">Customer Number</th>
                                        <th width="20%">GL</th>
                                        <th width="20%">Account Number</th>
                                        <!-- <th width="20%">Account Type</th> -->
                                        <th width="10%">Account Status</th>
                                        <th width="10%">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let uiPigmyAccount of uiPigmyAccounts; let i = index">
                                        <td>
                                            {{uiPigmyAccount.custName}}
                                        </td>
                                        <td>
                                            {{uiPigmyAccount.customerNo}}
                                        </td>
                                        <td>
                                            {{uiPigmyAccount.glName}}
                                           
                                        </td>
                                        <td>
                                            {{uiPigmyAccount.accountNo}}
                                        </td>
                                        <!-- <td>
                                            {{uiPigmyAccount.accountType}}
                                        </td> -->
                                        <td>
                                            <div class="badge"
                                                [ngClass]="{'badge-danger': (uiPigmyAccount.status==='Freeze'|| uiPigmyAccount.status==='Closed'), 'badge-success' : uiPigmyAccount.status=== 'Open', 'badge-warning' : uiPigmyAccount.status=== 'Dormant'}">
                                                {{uiPigmyAccount.status}}
                                            </div>
                                        </td>
                                         <td>
                                            <button type="button" title="Delete record"
                                                class="btn-shadow btn btn-danger btn-actions" data-toggle="modal"
                                                data-target="#deleteModal" (click)="delete(uiPigmyAccount)">
                                                <span class="btn-icon-wrapper opacity-10">
                                                    <i class="fa fa-trash fa-w-20"></i>
                                                </span>
                                            </button>
                                        </td>
                                    </tr>
                                    <tr *ngIf="uiPigmyAccounts.length==0">
                                        <td class="noRecordFoundText" colspan="5">No records found..</td>
                                    </tr>
                                </tbody>
                    </table>
                </div>


                <div class="paginationtableSection">
                   
                </div>

             </div>
        
        </div>
        <!--Page action content End here-->

       
    </div>
    <!--Page Content End here-->

</div>
 <!--Page Code End here-->


<div id="deleteModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true" data-backdrop="false">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Delete</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cancelDelete()">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <p class="mb-0">Are you sure do you want to delete?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" data-dismiss="modal" (click)="onDelete()">Yes</button>
                <button type="button" class="btn btn-primary" data-dismiss="modal" (click)="cancelDelete()">No</button>
            </div>
        </div>
    </div>
</div>
