<div class="modal fade bd-example-modal-lg show" #pigmyCollectionModal tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header" style="padding: 0.5rem 1rem !important;">
                <h5 class="modal-title" id="pigmyCollectionModalTitle">Pigmy Collection</h5>
            </div>
            <div class="modal-body">

                <div class="row">
                    <div class="col-md-4 position-relative form-group">
                        <label class="">Pigmy Collection <span class="mandatory">*</span></label>
                        <input tabindex="1" type="number" class="form-control" [(ngModel)]="pigmyCollection">
                    </div>
                    <div class="col-md-4 position-relative form-group">
                        <label class="">Total Submitted Collection<span class="mandatory">*</span></label>
                        <input tabindex="2" type="number" class="form-control" [(ngModel)]="pigmySubmitted">
                    </div>
                </div>


                <div style="max-height: 500px; min-height: 400px; overflow: auto; margin-top: 10px;">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th width="33%">Pigmy Account</th>
                                <th width="33%">Customer Name</th>
                                <th width="33%">Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let uiPigmyCollection of uiPigmyCollections; let i = index">
                                <td>
                                    <input class="form-control" [(ngModel)]="uiPigmyCollection.pigmyAccountNumber" readonly/>
                                </td>
                                <td>
                                    <input class="form-control" [(ngModel)]="uiPigmyCollection.custName" readonly/>
                                </td>
                                <td>
                                    <input class="form-control" [(ngModel)]="uiPigmyCollection.pigmyAmount" type="number" readonly/>
                                </td>
                            </tr>
                            <tr *ngIf="uiPigmyCollections.length==0">
                                <td class="noRecordFoundText" colspan="2">No records found..</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
               
                <div class="row">
                    <div class="col-md-6 position-relative">
                        <button class="mt-1 btn btn-left-margin10 btn-secondary" (click)="close()">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
