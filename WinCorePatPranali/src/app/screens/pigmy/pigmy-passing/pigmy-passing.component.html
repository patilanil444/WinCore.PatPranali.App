<div class="row">
    <div class="col-md-12">
        <div class="main-card mb-3 card">
            <div class="card-body">
               
                <h5 class="card-title">Pigmy Passing</h5>
                <form [formGroup]="pigmyPassingForm" #form="ngForm">
                    <div class="row">
                        <div class="col-md-3 position-relative form-group">
                            <label class="">Pigmy From Date <span class="mandatory">*</span></label>
                            <input tabindex="1" type="text" class="form-control" formControlName="pigmyFromDate"
                            bsDatepicker [bsConfig]="datepickerConfig">
                        </div>
                        <div class="col-md-3 position-relative form-group">
                            <label class="">Pigmy To Date <span class="mandatory">*</span></label>
                            <input tabindex="1" type="text" class="form-control" formControlName="pigmyToDate"
                            bsDatepicker [bsConfig]="datepickerConfig">
                        </div>
                        <div class="col-md-3 position-relative">
                            <label class="">Pigmy Agent</label>
                            <div class="input-group">
                                <ngx-select-dropdown [config]="configAgent" tabindex="2" [options]="uiPigmyAgents"
                                formControlName="pigmyAgent" style="width: 100%;"
                                    [multiple]="false"></ngx-select-dropdown>
                            </div>
                        </div>
                
                        <div class="col-md-3 position-relative">
                            <button type="button" class="mt-1 btn btn-info" tabindex="8" style="margin-top: 30px !important;"
                                (click)="showCollections()">Show Collections</button>
                        </div>
                    </div>
                </form>

                <div class="row">
                    <div class="col-lg-12">
                        <div style="max-height: 320px; min-height: 320px; overflow: auto; margin-top: 10px;">
                            <table class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th width="33%">Collection Date</th>
                                        <th width="33%">Total Collection Amount</th>
                                        <!-- <th width="25%">Commision Amount</th> -->
                                        <th width="33%">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let uiPigmyCollection of uiPigmyCollections; let i = index">
                                        <td>
                                            {{uiPigmyCollection.pigmyDate}}
                                        </td>
                                        <td>
                                            <input class="form-control" [(ngModel)]="uiPigmyCollection.totalCollection" readonly/>
                                        </td>
                                        <!-- <td>
                                            <input class="form-control" [(ngModel)]="uiPigmyCollection.commisionAmount" type="number" readonly/>
                                        </td> -->
                                        <td>
                                            <button (click)="passCollection(uiPigmyCollection)" class="btn btn-success">Accept</button>

                                            <button (click)="viewCollection(uiPigmyCollection)" class="btn btn-info btn-left-margin10">View</button>
                                        </td>
                                    </tr>
                                    <tr *ngIf="uiPigmyCollections.length==0">
                                        <td colspan="4">No records found..</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>


                <div class="row">
                    <div class="col-md-6 position-relative">
                        <!-- <button type="button" class="mt-1 btn btn-primary" tabindex="8"
                            (click)="savePassing()">Submit</button> -->
                        <button class="mt-1 btn btn-left-margin10 btn-danger" tabindex="9" (click)="clearAll()">Clear
                            All</button>
                    </div>
                </div>
              
            </div>
        </div>
    </div>
</div>

<app-pigmy-collection-info #pigmyCollectionModal 
[uiPigmyCollections]="uiPigmyDailyCollections"
[pigmyCollection]="pigmyCollection"
[pigmySubmitted]="pigmySubmitted"></app-pigmy-collection-info>
