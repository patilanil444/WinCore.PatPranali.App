		  				Search Account
            </label> 
        

          

        </div>
        <!--Page Header End here-->

        <!--Page action content Start here-->
        <div class="page-section-content">

            <!--Page filter Start here-->
            <div class="page-section-filtersection">
                <div>
                    <form [formGroup]="searchForm" #form="ngForm">
                        <div class="filterSectionAllCotrols2">

                            <div class="filterSectionContentCotrols4">
                                <div>
                                    <label  class="form_label_forControl labelwithFilter">Search by GL</label>
                                </div>
                                <div class="input-group">
                                        <ngx-select-dropdown [config]="config" tabindex="1" [options]="uiAllGeneralLedgers"
                                        style="width: 100%;" formControlName="generalLedger"
                                        [multiple]="false"></ngx-select-dropdown>
                                </div>
                            </div>

                            <div class="filterSectionContentCotrols4">                            
                                <div>
                                    <label  class="form_label_forControl labelwithFilter">Search by Customer Number</label>
                                </div>
                                <div class="input-group">
                                <input tabindex="2" type="text" formControlName="customerNumber" class="form-control">
                                </div>
                            </div>

                            <div class="filterSectionContentCotrols4">                            
                                <div>
                                    <label  class="form_label_forControl labelwithFilter">Search by Account Number</label>
                                </div>
                                <div class="input-group">
                                <input tabindex="3" type="text" formControlName="accountNumber" class="form-control">
                                </div>
                            </div>

                            <div class="filterSectionContentCotrols4_1 actionBtnsInFilterSection"  *ngIf="isOperatorUser() || isDepositOfficerUser() || isLoanOfficerUser() || isPassingOfficerUser()">
                                    <button class="btn  btn-info" 
                                    tabindex="4" (click)="searchAccounts()">
                                         <svg  class="iconInBtn2" width="1em" height="1em" fill="currentColor"
                                          x="0px" y="0px" viewBox="0 0 122.879 119.799" enable-background="new 0 0 122.879 119.799" xml:space="preserve"><g><path d="M49.988,0h0.016v0.007C63.803,0.011,76.298,5.608,85.34,14.652c9.027,9.031,14.619,21.515,14.628,35.303h0.007v0.033v0.04 h-0.007c-0.005,5.557-0.917,10.905-2.594,15.892c-0.281,0.837-0.575,1.641-0.877,2.409v0.007c-1.446,3.66-3.315,7.12-5.547,10.307 l29.082,26.139l0.018,0.016l0.157,0.146l0.011,0.011c1.642,1.563,2.536,3.656,2.649,5.78c0.11,2.1-0.543,4.248-1.979,5.971 l-0.011,0.016l-0.175,0.203l-0.035,0.035l-0.146,0.16l-0.016,0.021c-1.565,1.642-3.654,2.534-5.78,2.646 c-2.097,0.111-4.247-0.54-5.971-1.978l-0.015-0.011l-0.204-0.175l-0.029-0.024L78.761,90.865c-0.88,0.62-1.778,1.209-2.687,1.765 c-1.233,0.755-2.51,1.466-3.813,2.115c-6.699,3.342-14.269,5.222-22.272,5.222v0.007h-0.016v-0.007 c-13.799-0.004-26.296-5.601-35.338-14.645C5.605,76.291,0.016,63.805,0.007,50.021H0v-0.033v-0.016h0.007 c0.004-13.799,5.601-26.296,14.645-35.338C23.683,5.608,36.167,0.016,49.955,0.007V0H49.988L49.988,0z M50.004,11.21v0.007h-0.016 h-0.033V11.21c-10.686,0.007-20.372,4.35-27.384,11.359C15.56,29.578,11.213,39.274,11.21,49.973h0.007v0.016v0.033H11.21 c0.007,10.686,4.347,20.367,11.359,27.381c7.009,7.012,16.705,11.359,27.403,11.361v-0.007h0.016h0.033v0.007 c10.686-0.007,20.368-4.348,27.382-11.359c7.011-7.009,11.358-16.702,11.36-27.4h-0.006v-0.016v-0.033h0.006 c-0.006-10.686-4.35-20.372-11.358-27.384C70.396,15.56,60.703,11.213,50.004,11.21L50.004,11.21z"/></g></svg>
                                          Search
                                    </button>

                                    <div class="addAccountActionBtn">
                                        <button  class="btn action-primatryBtn1" tabindex="5">Add Account</button>
                                        <button type="button" aria-haspopup="true"  tabindex="6" aria-expanded="false" data-toggle="dropdown" class="dropdown-toggle-split dropdown-toggle btn action-primatryBtn1"><span class="sr-only">Toggle Dropdown</span></button>
                                        <div tabindex="-1" role="menu" aria-hidden="true" class="dropdown-menu" x-placement="bottom-start" 
                                        style="position: absolute; will-change: transform; top: 0px; left: 0px; transform: translate3d(67px, 32px, 0px);">
                                            <button type="button" tabindex="0" class="dropdown-item" (click)="addAccount('saving-accounts')">Saving</button>
                                            <button type="button" tabindex="0" class="dropdown-item" (click)="addAccount('deposit-accounts')">Deposit</button>
                                            <button type="button" tabindex="0" class="dropdown-item" (click)="addAccount('loan-accounts')">Loan</button>
                                            <button type="button" tabindex="0" class="dropdown-item" (click)="addAccount('other-accounts')">Other</button>
                                        </div>
                                    </div>


                                        <button class="btn btn-danger" style="padding: 7px 10px !important;"  tabindex="7"
                                        (click)="clear()">
                                        Clear
                                    </button>
                            
                            </div>
                                
                        </div>
                    </form>
                </div>
                       
                    
                    


               

            </div>


             <!--Page table content Start here-->
             <div class="page-section-tablecontent">

                <div>
                   <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th width="18%">General Ledger</th>
                                    <th width="15%">Account Number</th>
                                    <th width="18%">Customer Number</th>
                                    <th width="20%">Name</th>
                                    <th width="12%">Rate Of Interest</th>
                                    <th width="7%">Status</th>
                                    <th width="10%">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr
                                    *ngFor="let uiAccount of uiAccounts | paginate: { itemsPerPage: 10, currentPage: p, totalItems: total }">
                                    <th scope="row">{{uiAccount.glName}}</th>
                                    <td>{{uiAccount.accountNo}}</td>
                                    <td>{{uiAccount.customerCodeStr}}</td>
                                    <td>{{uiAccount.custName}}</td>
                                    <td>{{uiAccount.int_Rate}}</td>
                                    <td>
                                        <div class="badge"
                                            [ngClass]="{'badge-danger': (uiAccount.status==='Freeze'|| uiAccount.status==='Closed'), 'badge-success' : uiAccount.status=== 'Open', 'badge-warning' : uiAccount.status=== 'Dormant'}">
                                            {{uiAccount.status}}
                                        </div>

                                    </td>
                                    <td>
                                        <div class="btnsCollectioninTable">
                                            <button type="button" title="Edit record"
                                                class="btn-shadow btn btn-info btn-actions" 
                                                *ngIf="isOperatorUser() || isDepositOfficerUser() || isLoanOfficerUser() || isPassingOfficerUser" 
                                                (click)="edit(uiAccount)">
                                                <span class="btn-icon-wrapper opacity-10">
                                                    <i class="fa fa-edit fa-w-10"></i>
                                                </span>
                                            </button>
                                            <button type="button" title="Delete record"
                                                class="btn-shadow btn btn-danger btn-actions" *ngIf="isOperatorUser()" data-toggle="modal"
                                                data-target="#deleteModal" (click)="delete(uiAccount)">
                                                <span class="btn-icon-wrapper opacity-10">
                                                    <i class="fa fa-trash fa-w-20"></i>
                                                </span>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr *ngIf="uiAccounts.length==0">
                                    <td class="noRecordFoundText" colspan="7">No records found..</td>
                                </tr>
                            </tbody>
                        </table>
                </div>


                <div class="paginationtableSection">
                     <pagination-controls (pageChange)="pageChangeEvent($event)"></pagination-controls>
                </div>

             </div>
        
        </div>
        <!--Page action content End here-->

       
    </div>
    <!--Page Content End here-->

</div>
 <!--Page Code End here-->

<div id="deleteModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true" data-backdrop="false">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Delete</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cancelDelete()">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <p class="mb-0">Are you sure do you want to delete?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" data-dismiss="modal" (click)="onDelete()">Yes</button>
                <button type="button" class="btn btn-primary" data-dismiss="modal" (click)="cancelDelete()">No</button>
            </div>
        </div>
    </div>
</div>
