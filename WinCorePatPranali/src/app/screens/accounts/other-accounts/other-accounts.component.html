 <div class="pageMasterSection formControlTabs">

    <!--Page Content Start here-->
    <div class="pageContentSection">
        
        <!--Page Header Start here-->
        <div class="page-section-header pagheaderWithBackBtn">
            <label class="headerTitleText">	
                <svg  class="svgIconForTitle" width="1em" height="1em" fill="currentColor"  x="0px" y="0px" viewBox="0 0 122.88 79.92" style="enable-background:new 0 0 122.88 79.92" xml:space="preserve"><style type="text/css">.st0{fill-rule:evenodd;clip-rule:evenodd;}</style><g><path class="st0" d="M76.29,31.83l-16.84,9.48l1.88-6.58c-7.78-4.07-14.85-4.04-21.61,0.83c4.55-12.69,15.16-16.41,25.35-13.96 l1.91-6.71L76.29,31.83L76.29,31.83L76.29,31.83L76.29,31.83z M3.06,0h89.63c1.69,0,3.06,1.38,3.06,3.06v15.13h-6.51V9.14 c0-1.49-1.22-2.71-2.71-2.71H9.22v0c-1.49,0-2.71,1.22-2.71,2.71v46.08c0,1.49,1.22,2.71,2.71,2.71h54.24v12.8H3.06 C1.38,70.73,0,69.35,0,67.67V3.06C0,1.38,1.38,0,3.06,0L3.06,0L3.06,0L3.06,0z M70.74,49.77l26-21.39l26.13,21.39H70.74 L70.74,49.77z M96.81,39.36c1.73,0,3.13,1.4,3.13,3.13c0,1.73-1.4,3.13-3.13,3.13c-1.73,0-3.13-1.4-3.13-3.13 C93.68,40.76,95.08,39.36,96.81,39.36L96.81,39.36z M72.33,79.92v-6.05h1.79l1.71-1.34V56.47h-3.49v-3.85h48.82v3.85h-3.48v16.06 l1.71,1.34h1.82v6.05H72.33L72.33,79.92z M83.95,73.87h1.97l1.71-1.34V56.47h-5.38v16.06L83.95,73.87L83.95,73.87L83.95,73.87z M95.76,73.87h1.97l1.7-1.34V56.47h-5.38v16.06L95.76,73.87L95.76,73.87L95.76,73.87z M107.57,73.87h1.97l1.71-1.34V56.47h-5.38 v16.06L107.57,73.87L107.57,73.87L107.57,73.87z M60.08,73.29c0.03,1.72,0.3,5.05,0.88,6.63H31.34c0.6-1.48,0.93-4.8,0.92-6.63 H60.08L60.08,73.29z M46.17,60.4c2.17,0,3.94,1.76,3.94,3.94c0,2.17-1.77,3.94-3.94,3.94c-2.17,0-3.94-1.76-3.94-3.94 C42.23,62.17,44,60.4,46.17,60.4L46.17,60.4z"/></g></svg>	 
                  Other subsidary account opening
            </label> 
        </div>
        <!--Page Header End here-->

        

       

        <!--Page action content Start here-->
        <div class="page-section-content pageWithTabsSection">
            <div>
                <form [formGroup]="summaryForm" #form="ngForm">
                    <div class="filterSectionAllCotrols2">

                        <div class="filterSectionContentCotrols3">
                            <div>
                                <label  class="form_label_forControl labelwithFilter">General Ledger</label>
                            </div>
                            <div class="input-group">
                                 <ngx-select-dropdown [config]="config" tabindex="1" [options]="uiOtherGeneralLedgers"
                                    style="width: 100%;" formControlName="generalLedger"
                                    [multiple]="false" (change)="changeGeneralLedger($event)"
                                    [ngClass]="{'disabled': !isAddMode}" ></ngx-select-dropdown>
                            </div>
                        </div>

                        <div class="filterSectionContentCotrols3">                            
                            <div>
                                <label  class="form_label_forControl labelwithFilter">Account Number</label>
                            </div>
                            <div class="input-group">
                                 <input tabindex="2" type="text" readonly class="form-control" formControlName="glAccountNumberStr">
                            </div>
                        </div>
                        <div class="filterSectionContentCotrols3_1">
                            <app-cust-search tabindex="3" [ngClass]="{'disabled': !isAddMode}" 
                            (customers)="getCustomers($event)" [allowMultiSearch]="false">
                            </app-cust-search>
                        </div>
                    </div>
                </form>
            </div>

           
             <div class="page-section-tabsControls inpageMiddleSectioWithTab">
			 
			  <ul class="nav nav-tabs">
                    <li class="nav-item">
                        <a role="tab" class="nav-link active" id="tab-0" data-toggle="tab" href="#tab-content-0">
                            <span>Customer Details </span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a role="tab" class="nav-link" id="tab-0" data-toggle="tab" href="#tab-content-1">
                            <span>Account Details</span>
                        </a>
                    </li>
                </ul>


             </div>

             <div class="page-section-tabsControls-data">

                <div class="tab-content">
                    <div class="tab-pane tabs-animation fade show active" id="tab-content-0" role="tabpanel">
                        <form [formGroup]="customerDetailsForm" #form="ngForm">
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="tab-content">
                                        <div class="row">
                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">Customer Number</label>
                                                <input tabindex="5" type="text" class="form-control" readonly
                                                    formControlName="customerNumber">
                                            </div>
                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">Name</label>
                                                <input tabindex="6" type="text" class="form-control" readonly
                                                    formControlName="name">
                                            </div>
                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">Address</label>
                                                <input tabindex="7" type="text" class="form-control" readonly
                                                    formControlName="address">
                                            </div>
                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">Mobile</label>
                                                <input tabindex="8" type="text" class="form-control" readonly
                                                    formControlName="mobile">
                                            </div>
                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">Email</label>
                                                <input tabindex="9" type="text" class="form-control" readonly
                                                    formControlName="email">
                                            </div>
                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">PAN</label>
                                                <input tabindex="10" type="text" class="form-control" readonly
                                                    formControlName="pan">
                                            </div>
                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">Date Of Birth</label>
                                                <input tabindex="11" type="text" class="form-control" readonly
                                                    formControlName="dob" bsDatepicker [bsConfig]="datepickerConfig">
                                            </div>
                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">Aadhar Number</label>
                                                <input tabindex="12" type="text" class="form-control" readonly
                                                    formControlName="aadhar">
                                            </div>
                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">Joining Date</label>
                                                <input tabindex="13" type="text" class="form-control" readonly
                                                    formControlName="joiningDate" bsDatepicker [bsConfig]="datepickerConfig">
                                            </div>
                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">Customer Group</label>
                                                <input tabindex="14" type="text" class="form-control" readonly
                                                    formControlName="group">
                                            </div>
                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">Occupation</label>
                                                <input tabindex="15" type="text" class="form-control" readonly
                                                    formControlName="occupation">
                                            </div>
                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">City</label>
                                                <input tabindex="16" type="text" class="form-control" readonly
                                                    formControlName="city">
                                            </div>
                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">Zone</label>
                                                <input tabindex="17" type="text" class="form-control" readonly
                                                    formControlName="zone">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="tab-pane tabs-animation fade show" id="tab-content-1" role="tabpanel">
                        <form [formGroup]="accountForm" #form="ngForm">
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="tab-content">
                                        <div class="row">
                                            
                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">Account Opening Date <span
                                                        class="mandatory">*</span></label>
                                                <input tabindex="23" type="text" class="mb-2 form-control"
                                                    formControlName="accountOpeningDate" bsDatepicker [bsConfig]="datepickerConfig">
                                            </div>

                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">Account Status <span
                                                        class="mandatory">*</span></label>
                                                <select class="form-control formControl_dropdownselect" tabindex="22"
                                                    formControlName="accountStatus" (change)="selectAccountStatus($event)">
                                                    <option *ngFor="let uiAccountStatus of uiAccountStatuses"
                                                        [ngValue]="uiAccountStatus.constantNo">
                                                        {{uiAccountStatus.constantname}}
                                                    </option>
                                                </select>
                                            </div>
                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">Interest Rate <span
                                                        class="mandatory">*</span></label>
                                                <input tabindex="29" type="number" class="mb-2 form-control"
                                                    formControlName="interestRate" min="0" 
                                                    onKeyPress="if(this.value.length >=3) return false;" >
                                            </div>
                                            
                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">Last Interest Date <span
                                                        class="mandatory">*</span></label>
                                                <input tabindex="25" type="text" class="form-control"
                                                    formControlName="lastInterestDate" bsDatepicker [bsConfig]="datepickerConfig">
                                            </div>
                                        
                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">Last Transaction Date <span
                                                        class="mandatory">*</span></label>
                                                <input tabindex="26" type="text" class="form-control"
                                                    formControlName="lastTransactionDate" bsDatepicker [bsConfig]="datepickerConfig">
                                            </div>

                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">Mature Date <span
                                                        class="mandatory">*</span></label>
                                                <input tabindex="26" type="text" class="form-control"
                                                    formControlName="matureDate" bsDatepicker [bsConfig]="datepickerConfig">
                                            </div>

                                            <div class="col-md-3 position-relative form-group">
                                                <label class="">Account Close Date</label>
                                                <input tabindex="28" type="text" readonly class="form-control"
                                                    formControlName="accountCloseDate" bsDatepicker [bsConfig]="datepickerConfig">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

               
             </div>

             <div class="page-section-footerActionBtns">
                

                     <button class="btn action-primatryBtn"  (click)="saveOtherAccount()" *ngIf="isOperatorUser()"
                            tabindex="42">Submit</button>
                            <button class="btn btn-info" *ngIf="!isAccountAuthorized && (isPassingOfficerUser() || isAdministratorUser())" (click)="authoriseAccount()"
                            tabindex="43">Authorise Account</button>
                        <button class="btn btn-danger" (click)="clear()" *ngIf="isOperatorUser()"
                            tabindex="44">Clear</button>
             </div>
        
        </div>
        <!--Page action content End here-->

       
    </div>
    <!--Page Content End here-->

</div>
 <!--Page Code End here-->
