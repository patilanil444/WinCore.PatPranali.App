<div class="app-container">
    <div class="h-100 bg-plum-plate bg-animation">
        <div class="d-flex h-100 justify-content-center align-items-center">
            <div class="mx-auto app-login-box col-md-8">
                <div class="app-logo-inverse mx-auto mb-3"></div>
                <div class="modal-dialog w-100 mx-auto">
                    <div class="modal-content">
                        <div class="modal-body">
                            <div class="h5 modal-title text-center">
                                <h4 class="mt-2">
                                    <div>Welcome back,</div>
                                    <span>Please login to your account.</span>
                                </h4>
                            </div>
                            <form [formGroup]="loginForm" #form="ngForm">
                                <div class="form-row">
                                    <div class="col-md-12">
                                        <div class="position-relative form-group">
                                            <input name="userName" id="txtUserName" placeholder="Username..." autocomplete="off"
                                                type="text" class="form-control" formControlName="userName">
                                        </div>
                                    </div>
                                    <div class="col-md-12">
                                        <div class="position-relative form-group">
                                            <input name="password" id="txtPassword" placeholder="Password..."  autocomplete="off"
                                                type="password" class="form-control" formControlName="password">
                                        </div>
                                    </div>
                                </div>
                                    <!-- <div class="position-relative form-check">
                                        <input name="check" id="exampleCheck" type="checkbox" class="form-check-input">
                                        <label for="exampleCheck" class="form-check-label">Keep me logged in</label>
                                    </div> -->
                            </form>
                            <div class="divider"></div>
                            <h6 class="mb-0">No account? Please contact your administrator to create new one.</h6>
                        </div>
                        <div class="modal-footer clearfix">
                            <!-- <div class="float-left">
                                <a href="javascript:void(0);" class="btn-lg btn btn-link">Recover Password</a>
                            </div> -->
                            <div class="float-right">
                                <button class="btn btn-primary btn-lg" (click)="login()">Login to Dashboard</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="text-center text-white opacity-8 mt-3">Copyright © ArchitectUI 2019</div>
            </div>
        </div>
    </div>
</div>
