<div class="modal fade bd-example-modal-lg show" #messageBoxModal tabindex="-1">
    <div class="modal-dialog modal-lx">
        <div class="modal-content">
            <div class="modal-header" style="padding: 0.5rem 1rem !important;">
                <h5 class="modal-title" id="messageBoxModalTitle">Please confirm</h5>
            </div>
            <div class="modal-body">
                <fieldset>
                    <div>
                        <div class="row" style="font-weight: bold; margin: 20px;">
                            {{messageNote.value}}
                        </div>
                        <div class="divider"></div>
                        <div class="row" style="margin: 10px;">
                            <div class="col-md-12 position-relative">
                                <button class="mt-1 btn btn-primary" (click)="confirm()">Yes</button>
                                <button class="mt-1 btn btn-danger btn-left-margin10" (click)="close()">No</button>
                            </div>
                        </div>
                    </div>
                </fieldset>
                
            </div>
        </div>
    </div>
</div>
