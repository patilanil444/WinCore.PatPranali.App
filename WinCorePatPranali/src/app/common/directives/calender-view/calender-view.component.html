<div class="calendar" [style.pointer-events]="isDisabled ? 'none' : 'auto'">
    <div class="calendar-header">
      <button (click)="goToPreviousMonth()">&#60;</button>
      
      <!-- Month and Year Selector -->
      <select [(ngModel)]="currentMonth" (change)="onMonthChange($event)">
        <option *ngFor="let month of monthNames; let i = index" [value]="i">
          {{ month }}
        </option>
      </select>
  
      <select [(ngModel)]="currentYear" (change)="onYearChange($event)">
        <option *ngFor="let year of yearList" [value]="year">
          {{ year }}
        </option>
      </select>
      
      <button (click)="goToNextMonth()">&#62;</button>
    </div>
    
    <div class="calendar-body">
      <div class="calendar-weekdays">
        <div *ngFor="let day of ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']">{{ day }}</div>
      </div>
      
      <div class="calendar-days">
        <div *ngFor="let blank of [].constructor(firstDayOfMonth); let i = index" class="calendar-day empty"></div>
        <div *ngFor="let day of daysInMonth" 
             class="calendar-day" 
             [class.today]="isToday(day)"
             [class.selected]="isSelected(day)"
             (click)="selectDate(day)">
          {{ day }}
        </div>
      </div>
    </div>
  </div>
