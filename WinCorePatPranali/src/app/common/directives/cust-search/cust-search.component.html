<form [formGroup]="searchForm" #form="ngForm">


    <div class="filterSectionAllCotrols">

        <div class="filterSectionContentCotrols">
            <div>
                <label  class="form_label_forControl">Search Customer By </label>
            </div>
            <div class="dropwControlSectionOption">
                <select class="form-control formControl_dropdownselect" tabindex="1" formControlName="searchBy">
                    <option *ngFor="let uiCustomerSearch of uiCustomerSearchBy" [ngValue]="uiCustomerSearch.code">
                        {{uiCustomerSearch.name}}
                    </option>
                </select>
            </div>
        </div>
    
        <div class="filterSectionContentCotrols">
            <div>
                <label  class="form_label_forControl">Customer Search Text</label>
            </div>
            <div>
                <ng-autocomplete
                class="formControl_actiontextBox"
                placeHolder="Enter search text"
                [data]="uiCustomers"
                [searchKeyword]="keyword"
                [itemTemplate]="itemTemplateStatic"
                (selected)='selectEvent($event)'
                (inputChanged)='onChangeSearch($event)'>
            </ng-autocomplete>
    
            <ng-template #itemTemplateStatic let-item>
                <a [innerHTML]="item.customerCodeStr +'-'+ item.custName"></a>
              </ng-template>
            </div>
        </div>

        <div *ngIf="allowMultiSearch" class="position-relative form-group">
            <button class="btn btn-info" style="float: right;" tabindex="2" (click)="searchCustomer()"><i
                    class="fa fa-search"></i> Search</button>
        </div>
    </div>

</form>
